<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a2e57">
<title>متوقف مؤقتًا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:'Cairo',sans-serif;color:#fff;text-align:center;
    background:linear-gradient(125deg,#061d38,#0a2e57 40%,#1479c9);background-size:200% 200%;animation:shift 12s ease-in-out infinite alternate}
  .card{max-width:420px;padding:36px 26px;border-radius:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .8s cubic-bezier(.22,.7,.2,1) both}
  .ico{font-size:54px;display:inline-block;animation:float 3.5s ease-in-out infinite}
  h1{font-size:26px;font-weight:900;margin:10px 0 8px}
  p{opacity:.92;line-height:1.8}
  @keyframes shift{to{background-position:100% 50%}}
  @keyframes up{from{opacity:0;transform:translateY(20px)}}
  @keyframes float{50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <main class="card">
    <div class="ico">🌊</div>
    <h1>الموقع متوقف مؤقتًا</h1>
    <p>الحجز مقفول دلوقتي.<br>هنرجع قريب بإذن الله 💙</p>
  </main>
</body>
</html>
